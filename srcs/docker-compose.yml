name: inception

services:
  mariadb:
    build: # Dockerfile location
      context: ./requirements/mariadb
    image: mariadb:inception
    pull_policy: never # never use pre configed image
    restart: unless-stopped # restrat when it crash or abnormal termination, except that do nothing
    environment:  # set environment variables to container
      DB_NAME: ${DB_NAME:?DB_NAME is required} # entrypoint.sh will read these two from .env and make DB or users
      DB_USER: ${DB_USER:?DB_USER is required} # if .env like credential files have variables, replace it, if doesnt have output error and stop
      DB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets: # mount secret files
      - db_root_password
      - db_password
    volumes: # container side location
      - type: volume
        source: mariadb_data
        target: /var/lib/mysql
        volume:
          nocopy: true # no initialize copy to empty volume -> let me do initialize process made myself
    networks:
      - inception

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress:inception
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - mariadb
      - redis
    environment:
      DB_HOST: mariadb:3306
      REDIS_HOST: redis
      DB_NAME: ${DB_NAME:?DB_NAME is required} # Wordpressが利用するDB名
      DB_USER: ${DB_USER:?DB_USER is required} # Wordpress専用のDB User
      DB_PASSWORD_FILE: /run/secrets/db_password
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
      WP_TITLE: ${WP_TITLE:?WP_TITLE is required}
      WP_ADMIN_USER: ${WP_ADMIN_USER:?WP_ADMIN_USER is required}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?WP_ADMIN_EMAIL is required}
      WP_USER: ${WP_USER:?WP_USER is required}
      WP_USER_EMAIL: ${WP_USER_EMAIL:?WP_USER_EMAIL is required}
      WP_ADMIN_PASSWORD_FILE: /run/secrets/wp_admin_password
      WP_USER_PASSWORD_FILE: /run/secrets/wp_user_password
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
      - cache

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx:inception
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - wordpress
      - website
      - adminer
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
    ports:
      - "443:443" # "host port:container port"
    volumes:
      - wordpress_data:/var/www/html:ro # read only
    networks:
      - inception

  website:
    build:
      context: ./requirements/bonus/website
    image: website:inception
    pull_policy: never
    restart: unless-stopped
    networks:
      - inception

  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer:inception
    pull_policy: never
    restart: unless-stopped
    depends_on:
      - mariadb
    networks:
      - inception

  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis:inception
    pull_policy: never
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
      - cache

networks:
  inception:
    driver: bridge
  cache:
    driver: bridge
    internal: true

volumes:
  mariadb_data:
  wordpress_data:

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
